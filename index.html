<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kementerian Pendidikan - Dashboard Pelaporan</title>
  
  <!-- Menggunakan Font Inter & FontAwesome untuk Ikon -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
      overflow: hidden;
    }

    /* --- SIDEBAR BARAT (KIRI) --- */
    .sidebar {
      width: 320px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.03);
    }

    .brand-header {
      text-align: center;
      padding-bottom: 12px;
    }

    .brand-logo {
      width: 110px;
      height: auto;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      color: #0284c7;
      margin-top: 6px;
      line-height: 1.3;
    }

    /* Senarai Menu Navigasi */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background-color: #ffffff;
      text-decoration: none;
      color: #334155;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .nav-btn:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    /* Keadaan Aktif (Menu Yang Dipilih) */
    .nav-btn.active {
      background-color: #fefce8; /* Warna kuning lembut */
      border-color: #fde047;
      box-shadow: 0 2px 6px rgba(234, 179, 8, 0.15);
    }

    .nav-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background-color: #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0284c7;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .nav-btn.active .nav-icon {
      background-color: #ca8a04;
      color: #ffffff;
    }

    .nav-text {
      display: flex;
      flex-direction: column;
    }

    .nav-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-desc {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    /* --- UTAMA (KANAN - LOOKER STUDIO) --- */
    .main-content {
      flex: 1;
      height: 100vh;
      background-color: #ffffff;
      position: relative;
    }

    .main-content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- KAWASAN NAVIGASI KIRI -->
  <aside class="sidebar">
    <div class="brand-header">
      <!-- JKR / JPN / KPM Logo Placeholder -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/500px-Coat_of_arms_of_Malaysia.svg.png" alt="Logo KPM" class="brand-logo">
      <h1 class="brand-title">Kementerian Pendidikan<br>Bahagian Profesionalisme Guru</h1>
      <p class="brand-subtitle">Dashboard Pembekal Latihan Keguruan</p>
    </div>

    <nav class="nav-list">
  <!-- Butang Active / Semasa -->
  <a href="https://datastudio.google.com/embed/reporting/acf42a28-7336-451a-a59c-4ed574a4e429/page/OUByF" target="dashboard-frame" class="nav-btn active">
    <div class="nav-icon"><i class="fa-solid fa-chart-area"></i></div>
    <div class="nav-text">
      <span class="nav-title">Umum</span>
      <span class="nav-desc">Status Semasa</span>
    </div>
  </a>
</nav>

      <a href="https://datastudio.google.com/embed/reporting/65ae661a-9eb6-4584-8148-284f6692b1b9/page/OUByF" target="dashboard-frame" class="nav-btn">
  <div class="nav-icon"><i class="fa-solid fa-person-chalkboard"></i></i></div>
  <div class="nav-text">
    <span class="nav-title">Mesyuarat</span>
    <span class="nav-desc">JKTPLK</span>
          </div>
      </a>

      <a href="https://datastudio.google.com/embed/reporting/95fa38d7-49c6-482c-aa85-34ba314e762e/page/OUByF" class="nav-btn">
        <div class="nav-icon"><i class="fa-solid fa-clipboard-check"></i></i></div>
        <div class="nav-text">
          <span class="nav-title">Penilaian Khas</span>
          <span class="nav-desc">JKTPLK Khas</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <div class="nav-icon"><i class="fa-solid fa-phone-volume"></i></i></div>
        <div class="nav-text">
          <span class="nav-title">Penilaian Tidak Rasmi</span>
          <span class="nav-desc">Perbincangan</span>
        </div>
      </a>

      <a href="#" class="nav-btn">
        <div class="nav-icon"><i class="fa-solid fa-circle-stop"></i></i></div>
        <div class="nav-text">
          <span class="nav-title">Tiada Pembentangan</span>
          <span class="nav-desc">Kebenaran Khas</span>
        </div>
      </a>
    </nav>
  </aside>

  <!-- KAWASAN UTAMA KANAN (PAPARAN LOOKER STUDIO) -->
  <main class="main-content">
    <iframe 
      name="dashboard-frame"
      src="https://datastudio.google.com/embed/reporting/acf42a28-7336-451a-a59c-4ed574a4e429/page/OUByF" 
      allowfullscreen 
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </main>

  <script>
    // Script ringkas untuk menukar gaya 'active' apabila butang diklik
    const navButtons = document.querySelectorAll('.nav-btn');
    
    navButtons.forEach(button => {
      button.addEventListener('click', function() {
        navButtons.forEach(btn => btn.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
